name: Publish Windows portable release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '25.2.1'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:updates
      - name: Verify, package, upload draft, then publish
        run: node scripts/project-node.mjs scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
