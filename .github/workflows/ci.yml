name: Validate source
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
      - run: npm ci
      - run: npm run check
      - run: node scripts/project-node.mjs scripts/schedule-checks/check.mjs --self-test
      - run: npm test
      - run: npm run test:studio-ui
      - run: npm run test:culling-ui
      - run: npm run test:picture-preview-ui
      - run: npm run test:retouch-tools-ui
      - run: npm run test:uploads-ui
      - run: npm run test:history-ui
      - run: npm run test:planner-ui
      - run: npm run test:layers-ui
      - run: npm run test:continuation-ui
      - run: npm run test:logs-ui
      - run: npm run test:agent-ui
