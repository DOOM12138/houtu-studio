<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工作流管理 · 厚涂小站</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/color/style.css"><script type="module" src="/color/workflows.js"></script><link rel="stylesheet" href="/update-notice.css"><script type="module" src="/update-notice.js"></script><link rel="stylesheet" href="/workspace.css"><script type="module" src="/workspace.js"></script></head><body>
<header><a class="brand" href="/">厚涂小站</a><nav aria-label="工作台"><a href="/studio/">照片项目</a><a href="/">人物精修</a><a href="/upscale/">超分4K</a><a href="/color/">调色与蒙版</a><a href="/creative/">特效与合成</a><a href="/server/">本机服务器</a><a href="/workflows/" aria-current="page">工作流管理</a></nav></header>
<main><div class="titlebar"><div><h1 id="workflow-page-title">工作流管理</h1><p>查看每一步的输入与产物，从失败的步骤继续。</p></div><button id="refresh-flows">刷新状态</button></div><div class="workflow-filters"><label>所属板块<select id="workflow-section"><option value="all">全部工作流</option><option value="ai">AI 修图</option><option value="portrait">人物手动修图</option><option value="color">调色</option><option value="project">照片项目</option><option value="source">RAW与图片导入</option></select></label><label>执行状态<select id="workflow-state"><option value="all">全部状态</option><option value="running">执行中</option><option value="error">失败</option><option value="interrupted">已中断</option><option value="stale">待更新</option><option value="done">已完成</option><option value="pending">等待开始</option></select></label><label>查找工作流<input id="workflow-query" type="search" placeholder="按作品名称查找"></label></div><p id="workflow-count" class="hint"></p><p id="workflow-notice" role="status" class="hint">每一步保留输入、产物和历次尝试。AI生成重试会调用账号；只重合成、手动修图和导出不重新生成。</p><div class="workflow-layout"><aside class="workflow-projects"><h2>我的工作流</h2><div id="project-list"></div></aside><section id="workflow-detail"><p class="empty-flow">还没有工作流。打开图片或开始修图后，步骤会保存在这里。</p></section></div></main></body></html>
