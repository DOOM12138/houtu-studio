<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light"><title>厚涂小站 · 单画布修图工作台</title>
<link rel="stylesheet" href="/workbench/unified.css"><link rel="stylesheet" href="/ai-desk.css"><script type="module" src="/workbench/unified.js"></script><script type="module" src="/update-notice.js"></script><link rel="stylesheet" href="/update-notice.css"></head>
<body><div id="app">
<header id="topbar">
 <button class="brand" id="project-menu" aria-label="工作台菜单"><img alt="" id="logo" src="/favicon.svg"><span>厚涂小站</span></button><span class="rule"></span><span class="project-name">照片工作台</span>
 <button id="find" class="with-icon search-trigger push" title="查找工具 (Ctrl / ⌘ + K)" aria-label="查找工具"><i data-icon="search"></i><span>找工具</span><kbd>⌘/Ctrl K</kbd></button>
 <div class="toolbar-group"><button id="undo" class="icon-only" title="撤销 (Ctrl / ⌘ + Z)" aria-label="撤销"><i data-icon="undo"></i></button><button id="redo" class="icon-only" title="重做 (Ctrl / ⌘ + Shift + Z)" aria-label="重做"><i data-icon="redo"></i></button></div>
 <span class="rule"></span><button id="open" class="with-icon outline"><i data-icon="import"></i>导入</button><button id="export" class="with-icon primary"><i data-icon="export"></i>导出</button>
 <input type="file" id="file" accept="image/*,.dng,.nef,.cr2,.cr3,.arw,.raf,.orf,.rw2" multiple hidden>
</header>
<div id="workbench-update-slot"></div>
<nav id="rail" aria-label="修图工具分类">
 <button class="rail-tool" data-section="color"><i data-icon="sliders"></i>调色</button><button class="rail-tool" data-section="portrait"><i data-icon="brush"></i>人物</button><button class="rail-tool" data-section="layers"><i data-icon="layers"></i>图层</button><button class="rail-tool" data-section="ai"><i data-icon="spark"></i>AI 修图</button>
 <button class="rail-tool rail-tail" data-section="steps"><i data-icon="steps"></i>步骤</button><button class="rail-tool help" id="about"><i data-icon="info"></i>说明</button>
</nav>
<main id="desk">
 <div id="documentbar"><i data-icon="image"></i><strong id="docName">打开照片</strong><span id="docSize"></span><button class="push" id="sessionInfo" title="查看试用说明与会话保存范围"><span id="ioState" role="status"></span></button></div>
 <div id="mat"><div id="unified-empty"><strong>打开一张照片，开始修图</strong><button type="button" id="empty-import" class="primary">导入照片</button></div><canvas id="stage" aria-label="修图画布，滚轮缩放，拖动平移；选择画笔后可在图上修整" tabindex="0"></canvas><span id="viewMode" hidden></span><label id="dividerWrap" hidden>原图<input type="range" min="1" max="99" value="50" id="splitPosition" aria-label="移动对比分界线">成片</label></div>
 <div id="viewbar">
  <button id="pan" class="icon-only" aria-label="平移画布" title="平移画布，按空格临时平移"><i data-icon="hand"></i></button>
  <button id="smaller" class="icon-only" aria-label="缩小"><i data-icon="minus"></i></button><output id="zoomLabel" title="相对于适应画面的缩放倍数">1.0×</output><button id="larger" class="icon-only" aria-label="放大"><i data-icon="plus"></i></button><button id="fit">适应</button>
  <span class="rule"></span><button id="compare" class="with-icon" aria-pressed="false"><i data-icon="compare"></i>对比</button><button id="original" aria-pressed="false" title="按住反斜杠临时查看原图">原图</button>
  <span class="push"></span><button id="toggleFilm" class="with-icon" aria-label="展开或收起照片条"><i data-icon="film"></i><span id="filmCount">照片</span></button>
 </div>
 <section id="film" aria-label="当前项目的照片"><div id="filmHead"><span id="filmLabel">照片</span><span class="muted" id="filmSummary"></span><button class="push" id="batch">多选</button><button class="soft" id="sync" hidden>同步调色</button><button id="remove-photos" hidden>移除</button></div><div id="filmPhotos"></div></section>
</main>
<aside id="inspector" aria-label="当前工具参数"><div id="panelHead"><h1 id="panelTitle">调色</h1><span class="push" id="sectionKind"></span><button id="mobilePanel" class="mobile-only push">收起参数</button></div><div id="parameterScroll"></div><div id="unified-ai" hidden></div></aside>
</div>
<dialog id="dialog" aria-labelledby="dialogTitle"><div class="dialog-head"><h2 id="dialogTitle"></h2><button id="closeDialog" class="icon-only" aria-label="关闭"><i data-icon="close"></i></button></div><div id="dialogBody" class="dialog-content"></div></dialog>
<div id="toast" role="status" hidden></div>
</body></html>
